name: hk-trends-tg

on:
  schedule:
    # 每 10 分鐘。GitHub 最密只支援 5 分鐘，而且繁忙時會延遲甚至跳過一次。
    # Trending 資料實際 10–40 分鐘先變一格。想慳啲改 '*/15'，想密啲 '*/5'。
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # Actions 頁面「Run workflow」= 即刻檢查一次

# 同一時間只准一個 run，唔好 cancel 緊跑嗰個（保護 state.json 寫入）
concurrency:
  group: hk-trends-tg
  cancel-in-progress: false

permissions:
  contents: write   # 要 commit state.json 返 repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run bot
        env:
          # ---- 本地/雲端 LLM（OpenAI 相容）----
          MODEL_API: openai
          MODEL_BASE_URL: https://api.zetaapi.ai
          MODEL_NAME: gpt-5.6-luna
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_TIMEOUT: "60"
          # ---- Telegram ----
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          # ---- 過濾門檻（想改就改呢度，唔使掂 .env）----
          TRENDS_HOURS: "6"
          MIN_TRAFFIC: "500"
          MAX_PUSH_PER_RUN: "5"
          NEXT_RUN_MINUTES: "10"
        run: python3 trends_tg_bot.py

      - name: Persist state.json
        if: always()
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json 冇變，唔使 commit"
            exit 0
          fi
          git config user.name  "hk-trends-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update state [skip ci]"
          # 拉一拉再推，避免同上一個 run 撞
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push
