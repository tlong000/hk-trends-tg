name: trends-tg (manual run-now)

# 排程交畀 hk-trends-loop.yml（長命 job 自己每 10 分鐘 loop，唔靠 GitHub cron 準時）。
# 呢個 workflow 淨係留畀你喺 Actions 頁面撳「Run workflow」即刻檢查一次。
on:
  workflow_dispatch:
    inputs:
      geo:
        description: "跑邊個地區"
        type: choice
        required: true
        default: both
        options: [both, HK, US]
      hours:
        description: "時間窗（小時）。留空＝用預設 6。補推舊嘢就填 12 或 24"
        required: false
        default: ""
      min_traffic:
        description: "搜尋量門檻。留空＝用預設（HK 500 / US 10000）"
        required: false
        default: ""
      max_push:
        description: "今次最多推幾多條。留空＝用預設（HK 5 / US 3）"
        required: false
        default: ""

# 同一時間只准一個 run，唔好 cancel 緊跑嗰個（保護 state 檔寫入）
concurrency:
  group: hk-trends-tg
  cancel-in-progress: false

permissions:
  contents: write   # 要 commit state 檔返 repo

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # ---- 兩邊共用：雲端 LLM（OpenAI 相容）----
      MODEL_API: openai
      MODEL_BASE_URL: https://api.zetaapi.ai
      MODEL_NAME: gpt-5.6-luna
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_TIMEOUT: "60"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
      NEXT_RUN_MINUTES: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Run bot (HK)
        if: inputs.geo == 'both' || inputs.geo == 'HK'
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # ---- 香港過濾門檻（想改就改呢度，唔使掂 .env）----
          TRENDS_HOURS: "6"
          MIN_TRAFFIC: "500"
          MAX_PUSH_PER_RUN: "5"
          # 手動觸發時填咗就覆寫上面三個（補推用）
          IN_HOURS: ${{ inputs.hours }}
          IN_MIN_TRAFFIC: ${{ inputs.min_traffic }}
          IN_MAX_PUSH: ${{ inputs.max_push }}
        run: |
          [ -n "$IN_HOURS" ]       && export TRENDS_HOURS="$IN_HOURS"
          [ -n "$IN_MIN_TRAFFIC" ] && export MIN_TRAFFIC="$IN_MIN_TRAFFIC"
          [ -n "$IN_MAX_PUSH" ]    && export MAX_PUSH_PER_RUN="$IN_MAX_PUSH"
          echo "HK：窗 ${TRENDS_HOURS}h / 門檻 ${MIN_TRAFFIC} / 上限 ${MAX_PUSH_PER_RUN}"
          python3 trends_tg_bot.py

      - name: Run bot (US)
        if: inputs.geo == 'both' || inputs.geo == 'US'
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID_US }}
          US_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN_US }}
          # ---- 美國過濾門檻 ----
          TRENDS_GEO: US
          TRENDS_HOURS: "6"
          MIN_TRAFFIC: "10000"
          MAX_PUSH_PER_RUN: "3"
          MAX_CHARS: "200"
          LOCAL_TZ: America/New_York
          NEWS_HL: en-US
          NEWS_GL: US
          NEWS_CEID: US:en
          NEWS_FALLBACK: "1"
          BOT_LABEL: 歐美熱搜推送
          BRAND_TAG: 歐美熱搜
          PROMPT_FILE: analysis_prompt_us.md
          STATE_FILE: state_us.json
          # 手動觸發時填咗就覆寫上面三個（補推用）
          IN_HOURS: ${{ inputs.hours }}
          IN_MIN_TRAFFIC: ${{ inputs.min_traffic }}
          IN_MAX_PUSH: ${{ inputs.max_push }}
        run: |
          # 有獨立 bot 就開返指令；共用 token 就一定要關，唔係兩邊互搶 getUpdates。
          if [ -n "$US_TG_BOT_TOKEN" ]; then
            export TG_BOT_TOKEN="$US_TG_BOT_TOKEN" TG_CONTROLS=1
          else
            export TG_CONTROLS=0
          fi
          [ -n "$IN_HOURS" ]       && export TRENDS_HOURS="$IN_HOURS"
          [ -n "$IN_MIN_TRAFFIC" ] && export MIN_TRAFFIC="$IN_MIN_TRAFFIC"
          [ -n "$IN_MAX_PUSH" ]    && export MAX_PUSH_PER_RUN="$IN_MAX_PUSH"
          echo "US：窗 ${TRENDS_HOURS}h / 門檻 ${MIN_TRAFFIC} / 上限 ${MAX_PUSH_PER_RUN}"
          python3 trends_tg_bot.py

      - name: Persist state files
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "hk-trends-bot"
          git config user.email "actions@users.noreply.github.com"
          # 排程 loop 可能同時寫緊同一個 state 檔，push 一定有一邊被 reject。
          # 每次重試都同遠端最新版 union 一次（merge_state.py），令兩邊嘅
          # 「已推過」記錄都保得住 —— 漏咗一個標記＝下次重推＝群組收到重複訊息。
          # 用 reset --hard 對齊遠端再放返合併結果，唔可以用 reset --soft：
          # soft 會令 index 保留舊 tree，commit 落去會連遠端新推嘅 code 一齊回滾。
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            python3 merge_state.py "origin/$BRANCH" state.json state_us.json
            cp state.json /tmp/_s_hk.json; cp state_us.json /tmp/_s_us.json
            git reset -q --hard "origin/$BRANCH"
            cp /tmp/_s_hk.json state.json; cp /tmp/_s_us.json state_us.json
            git add state.json state_us.json
            if git diff --cached --quiet; then
              echo "state 檔同遠端一致，唔使 commit"; exit 0
            fi
            git commit -q -m "chore: update state [skip ci]"
            if git push -q; then echo "state 已推上去（第 $attempt 次嘗試）"; exit 0; fi
            echo "push 被 reject（第 $attempt 次），同遠端重新合併再試"
            sleep 5
          done
          echo "::error::state 推唔上去，去重表未更新，之後可能會重推同一批熱點"
          exit 1
